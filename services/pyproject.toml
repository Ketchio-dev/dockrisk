[project]
name = "roadstar-services"
version = "0.1.0"
description = "RoadStar city dispatch: API (importer, HOS, geofence/detention, matching) and simulator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "shapely>=2.0",
    "pydantic>=2.7",
    "sse-starlette>=2.1",
    "anthropic>=1.4.0",
    "openai>=3.8.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
